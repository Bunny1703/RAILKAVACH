[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/auth/google"
  to = "/.netlify/functions/google-auth"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/auth/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/auth/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/health/supabase"
  to = "/.netlify/functions/supabase-health"
  status = 200

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/users"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302

[[redirects]]
  from = "/api/dashboard"
  to = "/.netlify/functions/dashboard"
  status = 200

[[redirects]]
  from = "/api/assets"
  to = "/.netlify/functions/assets"
  status = 200

[[redirects]]
  from = "/api/inventory"
  to = "/.netlify/functions/inventory"
  status = 200

[[redirects]]
  from = "/api/inspections"
  to = "/.netlify/functions/inspections"
  status = 200

[[redirects]]
  from = "/api/risk"
  to = "/.netlify/functions/risk"
  status = 200

[[redirects]]
  from = "/api/notifications"
  to = "/.netlify/functions/notifications"
  status = 200

[[redirects]]
  from = "/api/portals"
  to = "/.netlify/functions/portals"
  status = 200
